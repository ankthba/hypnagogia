pipeline_version: 0.1.0
dataset:
  name: malecns
  version: v1.0
  scope: brain
  weight_scale: 0.581
  weight_scale_source: 'male CNS connectome paper (Cell 2026, S0092-8674(26)00942-6):
    calibration of male CNS vs FAFB/FlyWire synapse detection'
  nt_source: consensus_nt
model:
  v_rest_mV: -52.0
  v_reset_mV: -52.0
  v_th_mV: -45.0
  tau_m_ms: 20.0
  tau_syn_ms: 5.0
  t_refr_ms: 2.2
  delay_ms: 1.8
  w_syn_mV: 0.275
  dt_ms: 0.1
  sign_rule: GABA & glutamate -1 (Liu & Wilson 2013), ACh/DA/OA/5-HT +1 (Shiu et al.
    2024); histamine -1 (HisCl, Hardie 1989 - pipeline decision)
drive:
  f_poi: 250
  no_refractory_when_driven: true
noise:
  mode: none
  sigma_mV: 0.0
  poisson:
    rate_hz: 0.0
    n_inputs: 1
    weight_mV: 0.275
run:
  n_parallel: 8
  openmp_threads: 0
  delete_standalone: true
  extra_compile_args:
  - -O3
  - -ffast-math
  - -march=native
params_table:
- name: V_rest
  value: -52 mV
  source: Kakaria & de Bivort 2017 (via Shiu 2024)
  cited: true
- name: V_reset
  value: -52 mV
  source: Shiu et al. 2024 model.py
  cited: true
- name: V_threshold
  value: -45 mV
  source: Kakaria & de Bivort 2017 (via Shiu 2024)
  cited: true
- name: tau_m
  value: 20 ms
  source: Kakaria & de Bivort 2017 (via Shiu 2024)
  cited: true
- name: tau_syn
  value: 5 ms
  source: Juergensen et al. 2021 (via Shiu 2024; excitatory value applied to all synapses
    as in Shiu)
  cited: true
- name: t_refractory
  value: 2.2 ms (0 for driven neurons)
  source: Lazar et al. 2021 / Kakaria & de Bivort 2017 (via Shiu 2024)
  cited: true
- name: delay
  value: 1.8 ms
  source: Paul et al. 2015 (via Shiu 2024)
  cited: true
- name: W_syn
  value: 0.275 mV / synapse
  source: Shiu et al. 2024 (free parameter, fit on FlyWire v630)
  cited: true
- name: weight_scale
  value: '0.581'
  source: male CNS paper (Cell 2026) synapse-count calibration vs FlyWire; user-supplied,
    checked in stage 0
  cited: true
- name: Poisson drive weight
  value: w_syn x 250 = 68.75 mV per event
  source: Shiu et al. 2024 model.py f_poi
  cited: true
- name: sign(histamine)
  value: '-1'
  source: Hardie 1989 Nature 339:704 (HisCl); pipeline decision beyond Shiu 2024
  cited: true
- name: sign(unknown NT)
  value: '+1'
  source: 'no source: neurons with no NT prediction default to excitatory (count reported
    in manifest)'
  cited: false
- name: dt
  value: 0.1 ms
  source: Brian2 default clock (as in Shiu 2024)
  cited: true
- name: sigma (noise)
  value: config; swept in stage 2
  source: this project (Stage 1); no biological source
  cited: false
_provenance:
  config_file: /Users/ankthba/Developer/fly/configs/stage3b_odor.yaml
odor_calibration:
  glomerulus_sets:
  - name: 1 glomerulus
    types:
    - ORN_DM1
  - name: 2 glomeruli
    types:
    - ORN_DM1
    - ORN_DM4
  - name: 4 glomeruli
    types:
    - ORN_DM1
    - ORN_DM4
    - ORN_VA2
    - ORN_DM2
  rates_hz:
  - 10
  - 20
  - 50
  - 100
  - 150
  odor_s: 1.0
  post_s: 2.0
  seeds:
  - 0
  - 1
  - 2
  target_frac_kc:
  - 0.05
  - 0.1
  criterion: at least one (glomerulus set, rate) gives a mean Kenyon-cell response
    fraction inside 5-10% AND activity that does not outlast the odour (post-odour
    population rate below 1% of the during-odour rate)
