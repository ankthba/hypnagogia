pipeline_version: 0.1.0
dataset:
  name: malecns
  version: v1.0
  scope: brain
  weight_scale: 0.581
  weight_scale_source: 'male CNS connectome paper (Cell 2026, S0092-8674(26)00942-6):
    calibration of male CNS vs FAFB/FlyWire synapse detection'
  nt_source: consensus_nt
model:
  v_rest_mV: -52.0
  v_reset_mV: -52.0
  v_th_mV: -45.0
  tau_m_ms: 20.0
  tau_syn_ms: 5.0
  t_refr_ms: 2.2
  delay_ms: 1.8
  w_syn_mV: 0.275
  dt_ms: 0.1
  sign_rule: GABA & glutamate -1 (Liu & Wilson 2013), ACh/DA/OA/5-HT +1 (Shiu et al.
    2024); histamine -1 (HisCl, Hardie 1989 - pipeline decision)
graded_release:
  populations:
  - APL
nt_corrections:
  populations:
  - DPM
drive:
  f_poi: 250
  no_refractory_when_driven: true
noise:
  mode: gaussian
  sigma_mV: 2.0
  poisson:
    rate_hz: 0.0
    n_inputs: 1
    weight_mV: 0.275
run:
  n_parallel: 14
  openmp_threads: 0
  delete_standalone: true
  extra_compile_args:
  - -O3
  - -ffast-math
  - -march=native
params_table:
- name: V_rest
  value: -52 mV
  source: Kakaria & de Bivort 2017 (via Shiu 2024)
  cited: true
- name: V_reset
  value: -52 mV
  source: Shiu et al. 2024 model.py
  cited: true
- name: V_threshold
  value: -45 mV
  source: Kakaria & de Bivort 2017 (via Shiu 2024)
  cited: true
- name: tau_m
  value: 20 ms
  source: Kakaria & de Bivort 2017 (via Shiu 2024)
  cited: true
- name: tau_syn
  value: 5 ms
  source: Juergensen et al. 2021 (via Shiu 2024; excitatory value applied to all synapses
    as in Shiu)
  cited: true
- name: t_refractory
  value: 2.2 ms (0 for driven neurons)
  source: Lazar et al. 2021 / Kakaria & de Bivort 2017 (via Shiu 2024)
  cited: true
- name: delay
  value: 1.8 ms
  source: Paul et al. 2015 (via Shiu 2024)
  cited: true
- name: W_syn
  value: 0.275 mV / synapse
  source: Shiu et al. 2024 (free parameter, fit on FlyWire v630)
  cited: true
- name: weight_scale
  value: '0.581'
  source: male CNS paper (Cell 2026) synapse-count calibration vs FlyWire; user-supplied,
    checked in stage 0
  cited: true
- name: Poisson drive weight
  value: w_syn x 250 = 68.75 mV per event
  source: Shiu et al. 2024 model.py f_poi
  cited: true
- name: sign(histamine)
  value: '-1'
  source: Hardie 1989 Nature 339:704 (HisCl); pipeline decision beyond Shiu 2024
  cited: true
- name: APL release
  value: graded, non-spiking
  source: Amin et al. 2020 eLife 9:e56954
  cited: true
- name: sign(unknown NT)
  value: '+1'
  source: 'no source: neurons with no NT prediction default to excitatory (count reported
    in manifest)'
  cited: false
- name: dt
  value: 0.1 ms
  source: Brian2 default clock (as in Shiu 2024)
  cited: true
- name: sigma (noise)
  value: config; swept in stage 2
  source: this project (Stage 1); no biological source
  cited: false
_provenance:
  config_file: /Users/ankthba/Developer/fly/configs/stage2_criticality.yaml
stage2:
  sigma_values_mV:
  - 0.5
  - 0.71
  - 1.0
  - 1.41
  - 1.5
  - 1.6
  - 1.65
  - 1.7
  - 1.75
  - 1.8
  - 1.85
  - 1.9
  - 1.95
  - 2.0
  - 2.83
  - 4.0
  - 5.66
  - 8.0
  seeds:
  - 0
  - 1
  - 2
  warmup_s: 1.0
  duration_s: 4.0
  mr_bin_ms: 2.0
  mr_kmax_ms: 500.0
  avalanche_bin_mult: 1.0
  max_avalanches_for_fit: 200000
  operating_rule: 'if any sigma is classified critical: the critical sigma with mean
    branching ratio closest to 1. Otherwise NO critical regime is reported as the
    finding, and the operating point for the downstream stages is the sigma whose
    Kenyon-cell population rate is closest, in log distance, to the measured KC spontaneous
    rate of 0.1 Hz (Turner, Bazhenov & Laurent 2008 J Neurophysiol 99:734), among
    sigmas that have any Kenyon-cell activity and whose outcome does not depend on
    the seed. Chosen to match biology, not to manufacture criticality. Sigmas classified
    ''saturated'' are NOT excluded: that label means the whole brain''s activity never
    pauses, which makes the avalanche analysis inapplicable there, and says nothing
    about the Kenyon cells, which is what this criterion is about. What the earlier
    rule, which did exclude them, would have chosen is reported alongside the choice.'
synapse_deviations:
  names:
  - kc_kc_axonal_not_nicotinic
  retained_fraction: 0.5
