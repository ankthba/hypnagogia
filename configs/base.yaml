# Base configuration. Every parameter carries its source. Values without a primary source are
# marked cited: false and are surfaced as "uncited" in the viewer's parameter table.
pipeline_version: "0.1.0"

dataset:
  name: malecns                 # male CNS connectome v1.0 (Janelia FlyEM / Google Research / Cambridge; Cell 2026)
  version: v1.0
  scope: brain                  # brain | cns   (cns = also VNC neurons; kept behind this flag for later motor work)
  weight_scale: 0.581           # male-CNS synapse counts x 0.581 = FlyWire-equivalent counts (male CNS paper; user-supplied;
                                # verified empirically in stage 0 by comparing type-to-type synapse counts of cross-matched neurons)
  weight_scale_source: "male CNS connectome paper (Cell 2026, S0092-8674(26)00942-6): calibration of male CNS vs FAFB/FlyWire synapse detection"
  nt_source: consensus_nt       # per-neuron neurotransmitter used for the synaptic sign (body-neurotransmitters table)

model:
  v_rest_mV: -52.0              # Kakaria & de Bivort 2017 Front Behav Neurosci 11:8, via Shiu et al. 2024 model.py
  v_reset_mV: -52.0             # Shiu et al. 2024 (model.py 'v_rst')
  v_th_mV: -45.0                # Kakaria & de Bivort 2017, via Shiu et al. 2024
  tau_m_ms: 20.0                # C_m R_m = 0.002 uF x 10 MOhm (Kakaria & de Bivort 2017), via Shiu et al. 2024
  tau_syn_ms: 5.0               # Juergensen et al. 2021 Neuromorph Comput Eng 1:024008 (excitatory tau), via Shiu et al. 2024
  t_refr_ms: 2.2                # Lazar et al. 2021 eLife 10:e62362 / Kakaria & de Bivort 2017, via Shiu et al. 2024
  delay_ms: 1.8                 # Paul et al. 2015 Front Cell Neurosci 9:29, via Shiu et al. 2024
  w_syn_mV: 0.275               # Shiu et al. 2024: the single free parameter, fit on FlyWire v630 so 100 Hz sugar-GRN -> ~80% of max MN9 firing
  dt_ms: 0.1                    # Brian2 default clock (Shiu et al. 2024 used the default)
  sign_rule: "GABA & glutamate -1 (Liu & Wilson 2013), ACh/DA/OA/5-HT +1 (Shiu et al. 2024); histamine -1 (HisCl, Hardie 1989 - pipeline decision)"

drive:
  f_poi: 250                    # Shiu et al. 2024 model.py: Poisson event adds w_syn*f_poi = 68.75 mV to v (guaranteed spike)
  no_refractory_when_driven: true   # Shiu et al. 2024 model.py: rfc = 0 for Poisson-driven neurons

noise:                          # STAGE 1 addition (not in Shiu et al. 2024, whose baseline is 0 Hz with no noise term)
  mode: none                    # none | gaussian | poisson
  sigma_mV: 0.0                 # gaussian: dv/dt = ... + sigma*sqrt(2/tau_m)*xi ; stationary voltage s.d. = sigma (config parameter)
  poisson:                      # alternative: independent Poisson background onto g (each neuron gets n_inputs streams at rate_hz)
    rate_hz: 0.0
    n_inputs: 1
    weight_mV: 0.275            # one connectome synapse worth (= w_syn)

run:
  n_parallel: 8
  openmp_threads: 0             # Apple clang has no -fopenmp; parallelism is across seeds/conditions in subprocesses
  delete_standalone: true
  extra_compile_args: ["-O3", "-ffast-math", "-march=native"]

params_table:                   # rendered on the Overview/Methods pages (name, value, source, cited)
  - {name: V_rest, value: "-52 mV", source: "Kakaria & de Bivort 2017 (via Shiu 2024)", cited: true}
  - {name: V_reset, value: "-52 mV", source: "Shiu et al. 2024 model.py", cited: true}
  - {name: V_threshold, value: "-45 mV", source: "Kakaria & de Bivort 2017 (via Shiu 2024)", cited: true}
  - {name: tau_m, value: "20 ms", source: "Kakaria & de Bivort 2017 (via Shiu 2024)", cited: true}
  - {name: tau_syn, value: "5 ms", source: "Juergensen et al. 2021 (via Shiu 2024; excitatory value applied to all synapses as in Shiu)", cited: true}
  - {name: t_refractory, value: "2.2 ms (0 for driven neurons)", source: "Lazar et al. 2021 / Kakaria & de Bivort 2017 (via Shiu 2024)", cited: true}
  - {name: delay, value: "1.8 ms", source: "Paul et al. 2015 (via Shiu 2024)", cited: true}
  - {name: W_syn, value: "0.275 mV / synapse", source: "Shiu et al. 2024 (free parameter, fit on FlyWire v630)", cited: true}
  - {name: weight_scale, value: "0.581", source: "male CNS paper (Cell 2026) synapse-count calibration vs FlyWire; user-supplied, checked in stage 0", cited: true}
  - {name: Poisson drive weight, value: "w_syn x 250 = 68.75 mV per event", source: "Shiu et al. 2024 model.py f_poi", cited: true}
  - {name: sign(histamine), value: "-1", source: "Hardie 1989 Nature 339:704 (HisCl); pipeline decision beyond Shiu 2024", cited: true}
  - {name: sign(unknown NT), value: "+1", source: "no source: neurons with no NT prediction default to excitatory (count reported in manifest)", cited: false}
  - {name: dt, value: "0.1 ms", source: "Brian2 default clock (as in Shiu 2024)", cited: true}
  - {name: sigma (noise), value: "config; swept in stage 2", source: "this project (Stage 1); no biological source", cited: false}
